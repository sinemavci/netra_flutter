name: netra_flutter_example
description: "Demonstrates how to use the netra_flutter plugin."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  netra_flutter:
    path: ../

  cupertino_icons: ^1.0.8

  image_picker:  ^1.0.7

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
