name: netra_flutter
description: "A Flutter networking plugin with offline queueing, slow network strategies, smart caching, circuit breaker, multipart uploads, and event-driven observability. Built on top of OkHttp via a native Android bridge."
version: 0.1.0-alpha
homepage: https://github.com/sinemavci/netra

environment:
  sdk: ^3.10.4
  flutter: '>=3.3.0'

dependencies:
  collection: ^1.19.1
  flutter:
    sdk: flutter
  freezed_annotation: ^3.1.0
  json_annotation: ^4.11.0
  meta: ^1.18.0
  pigeon: ^26.3.4
  plugin_platform_interface: ^2.0.2
  uuid: ^4.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.0
  freezed: ^3.2.5
  json_serializable: ^6.13.2

flutter:
  plugin:
    platforms:
      android:
        package: com.example.netra_flutter
        pluginClass: NetraFlutterPlugin